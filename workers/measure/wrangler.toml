# 측정 리버스 프록시 — ADR-006. 참가작은 팀명.proovit.kr로만 공개된다.
#
# 2026-09-20 배포했다. 네임서버를 클라우드플레어로 옮기면서 zone이 생겼고,
# `*.proovit.kr/*` route가 이 워커를 가리킨다. 재배포는 `npx wrangler deploy`.

name = "proovit-measure"
main = "src/index.ts"
compatibility_date = "2026-09-20"

# 팀 서브도메인 전부. 루트(proovit.kr)와 www는 우리 앱이라 걸지 않는다.
routes = [
  { pattern = "*.proovit.kr/*", zone_name = "proovit.kr" },
]

# 조용한 참가작의 마지막 몇 건을 올려 보내는 타이머(워커 주석 참조)
[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_URL = "https://proovit.kr"

# MEASURE_SECRET은 vars가 아니라 시크릿이다:
#   npx wrangler secret put MEASURE_SECRET
