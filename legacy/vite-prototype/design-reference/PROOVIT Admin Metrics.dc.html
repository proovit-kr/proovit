<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body { margin: 0; background: #0D1119; font-family: 'Pretendard Variable', Pretendard, sans-serif; color: #E8ECF3; }
a { color: #C8FF3D; text-decoration: none; }
a:hover { color: #DCFF7A; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</helmet>
<div style="min-height: 100vh; background: #0D1119;">

  <nav style="position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 36px; padding: 12px 28px; background: #10151F; border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div style="font-weight: 800; font-size: 16px; letter-spacing: 0.06em; color: #FFFFFF;">PROO<span style="color: #C8FF3D;">✓</span>IT <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #626C7F; font-weight: 700;">OPS</span></div>
    <div style="display: flex; gap: 26px; font-size: 13px; font-weight: 600;">
      <a href="PROOVIT Admin Judging.dc.html" style="color: #8A93A6;" style-hover="color: #FFFFFF;">심사</a>
      <span style="color: #FFFFFF; border-bottom: 2px solid #C8FF3D; padding-bottom: 3px; cursor: default;">지표 검증</span>
      <a href="PROOVIT Admin Seasons.dc.html" style="color: #8A93A6;" style-hover="color: #FFFFFF;">시즌 관리</a>
    </div>
  </nav>

  <main style="max-width: 1240px; margin: 0 auto; padding: 24px 28px 64px;">
    <div data-screen-label="요약 스트립" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;">
      <span style="color: #B7BFCC; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 6px 14px;">이번 주 제출 18건</span>
      <span style="color: #C8FF3D; background: rgba(200,255,61,0.07); border: 1px solid rgba(200,255,61,0.25); border-radius: 999px; padding: 6px 14px;">확정 {{ confirmedCount }}건</span>
      <span style="color: #FF9F6B; background: rgba(255,159,107,0.08); border: 1px solid rgba(255,159,107,0.25); border-radius: 999px; padding: 6px 14px;">대기 {{ pendingCount }}건</span>
    </div>

    <div data-screen-label="지표 테이블" style="background: #10151F; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden;">
      <div style="overflow-x: auto;">
        <div style="min-width: 880px;">
          <div style="display: grid; grid-template-columns: 1.6fr 0.7fr 1fr 0.8fr 1fr 1fr 1.4fr; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 11px; font-weight: 700; color: #626C7F; letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace;">
            <div>팀</div><div>주차</div><div style="text-align: right;">유효 가입자</div><div style="text-align: right;">증가율</div><div>증빙</div><div>상태</div><div>처리</div>
          </div>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
            <div style="display: grid; grid-template-columns: 1.6fr 0.7fr 1fr 0.8fr 1fr 1fr 1.4fr; gap: 12px; align-items: center; padding: 13px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); background: {{ r.bg }};">
              <div>
                <div style="font-weight: 700; font-size: 13px; color: #FFFFFF;">{{ r.team }}</div>
                <div style="margin-top: 1px; font-size: 11px; color: #626C7F;">{{ r.service }}</div>
              </div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A93A6;">{{ r.week }}</div>
              <div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; color: #E8ECF3;">{{ r.users }}</div>
              <div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; color: {{ r.deltaColor }};">{{ r.delta }}</div>
              <div>
                <div onClick="{{ r.zoom }}" style="width: 64px; height: 38px; border-radius: 6px; background: linear-gradient(135deg, #1A2333, #131A28); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #626C7F; cursor: pointer;" style-hover="border-color: rgba(200,255,61,0.4);">GA4</div>
              </div>
              <div>
                <sc-if value="{{ r.confirmed }}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #C8FF3D; background: rgba(200,255,61,0.09); border-radius: 5px; padding: 3px 8px;">✓ 확정됨</span>
                </sc-if>
                <sc-if value="{{ r.pending }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 11px; font-weight: 700; color: #8A93A6; background: rgba(255,255,255,0.06); border-radius: 5px; padding: 3px 8px;">대기</span>
                </sc-if>
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <sc-if value="{{ r.pending }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ r.confirm }}" style="background: #C8FF3D; color: #0B1220; border: none; border-radius: 7px; padding: 6px 14px; font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer;" style-hover="background: #DCFF7A;">확정</button>
                  <span style="position: relative; display: inline-block;">
                    <button onClick="{{ r.request }}" style="background: transparent; color: #8A93A6; border: none; padding: 6px 2px; font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;" style-hover="color: #C8FF3D;">원본 요청</button>
                    <sc-if value="{{ r.tip }}" hint-placeholder-val="{{ false }}">
                      <span style="position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: #1A2333; border: 1px solid rgba(255,255,255,0.14); color: #B7BFCC; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 7px; z-index: 10;">GA4 뷰어 초대 요청 메일 발송</span>
                    </sc-if>
                  </span>
                </sc-if>
                <sc-if value="{{ r.confirmed }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 11px; color: #626C7F;">리더보드에 반영됨</span>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </main>

  <sc-if value="{{ zoomOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeZoom }}" style="position: fixed; inset: 0; z-index: 100; background: rgba(5,9,18,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out;">
      <div style="width: min(720px, 90vw); aspect-ratio: 16/9; border-radius: 12px; background: linear-gradient(135deg, #1A2333, #131A28); border: 1px solid rgba(255,255,255,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; animation: modalIn 0.2s ease-out;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #8A93A6;">{{ zoomTeam }} · GA4 증빙 원본</div>
        <div style="font-size: 12px; color: #626C7F;">클릭하면 닫혀요</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280}}">
class Component extends DCLogic {
  state = { confirmed: { 4: true }, tipIdx: -1, zoomIdx: -1 };
  data = [
    { team: '새벽로켓', service: '빵집레이더', week: 'W5', users: 412, delta: '+18%' },
    { team: '북마클릿', service: '링크줍줍', week: 'W5', users: 356, delta: '+9%' },
    { team: '미닛테이커', service: '회의록요정', week: 'W5', users: 298, delta: '+7%' },
    { team: '강아지먼저', service: '산책메이트', week: 'W5', users: 187, delta: '-4%' },
    { team: '계량컵', service: '레시피환산기', week: 'W5', users: 152, delta: '+5%' },
  ];
  componentWillUnmount() { clearTimeout(this._tipT); }
  renderVals() {
    const { confirmed, tipIdx, zoomIdx } = this.state;
    const confirmedCount = 11 + Object.keys(confirmed).length - 1;
    const rows = this.data.map((d, i) => ({
      ...d,
      deltaColor: d.delta.startsWith('-') ? '#FF6B6B' : '#C8FF3D',
      confirmed: !!confirmed[i], pending: !confirmed[i],
      bg: confirmed[i] ? 'rgba(200,255,61,0.03)' : 'transparent',
      tip: tipIdx === i,
      confirm: () => this.setState(s => ({ confirmed: { ...s.confirmed, [i]: true } })),
      request: () => {
        this.setState({ tipIdx: i });
        clearTimeout(this._tipT);
        this._tipT = setTimeout(() => this.setState({ tipIdx: -1 }), 2400);
      },
      zoom: () => this.setState({ zoomIdx: i }),
    }));
    return {
      rows, confirmedCount,
      pendingCount: 18 - confirmedCount,
      zoomOpen: zoomIdx >= 0,
      zoomTeam: zoomIdx >= 0 ? this.data[zoomIdx].team : '',
      closeZoom: () => this.setState({ zoomIdx: -1 }),
    };
  }
}
</script>
</body>
</html>
