<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body { margin: 0; background: #0B1220; font-family: 'Pretendard Variable', Pretendard, sans-serif; color: #F4F6FA; }
a { color: #C8FF3D; text-decoration: none; }
a:hover { color: #DCFF7A; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@media (max-width: 720px) { #nav-menu { display: none !important; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
</style>
</helmet>
<div style="min-height: 100vh; background: linear-gradient(180deg, #0B1220 0%, #0D1526 45%, #14181F 100%); overflow-x: hidden;">

  <nav style="position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 32px; background: rgba(11,18,32,0.72); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.07);">
    <a href="PROOVIT Landing v2.dc.html" style="font-weight: 800; font-size: 20px; letter-spacing: 0.06em; color: #FFFFFF;">PROO<span style="color: #C8FF3D; font-weight: 900;">✓</span>IT</a>
    <div id="nav-menu" style="display: flex; gap: 32px; font-size: 14px; font-weight: 600;">
      <a href="PROOVIT Landing v2.dc.html" style="color: #B7BFCC;" style-hover="color: #FFFFFF;">리그 소개</a>
      <a href="PROOVIT Leaderboard.dc.html" style="color: #B7BFCC;" style-hover="color: #FFFFFF;">리더보드</a>
      <span style="color: #B7BFCC; cursor: pointer;" style-hover="color: #FFFFFF;">시즌 아카이브</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 5px 14px 5px 5px; cursor: pointer;" style-hover="border-color: rgba(200,255,61,0.4);">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #C8FF3D, #4A7A00); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #0B1220;">새</span>
      <span style="font-size: 13px; font-weight: 700; color: #F4F6FA;">팀 새벽로켓</span>
    </div>
  </nav>

  <main data-screen-label="참가 신청" style="max-width: 640px; margin: 0 auto; padding: 56px 24px 88px;">
    <div style="background: linear-gradient(160deg, #10192C, #0C1322); border: 1px solid rgba(255,255,255,0.09); border-radius: 22px; padding: 36px; box-shadow: 0 24px 60px rgba(0,0,0,0.45);">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;">
        <div>
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF;">시즌 1 참가 신청</h1>
          <p style="margin: 8px 0 0; font-size: 15px; color: #8A93A6;">1~2인 팀 · 코딩 경험이 없어도 괜찮아요</p>
        </div>
        <div style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; background: rgba(200,255,61,0.1); border: 1px solid rgba(200,255,61,0.35); color: #C8FF3D; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #C8FF3D; animation: blink 1.6s infinite;"></span>
        모집 마감 D-{{ cdDays }} {{ cdClock }}
        </div>
      </div>

      <form onSubmit="{{ submit }}" style="display: flex; flex-direction: column; gap: 22px; margin-top: 32px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 700; color: #B7BFCC;">팀명</label>
          <input type="text" required="{{ true }}" placeholder="예: 새벽로켓" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; font-size: 15px; color: #FFFFFF; font-family: inherit; outline: none;" style-focus="border-color: #C8FF3D;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 700; color: #B7BFCC;">팀원 초대 <span style="font-weight: 500; color: #626C7F;">(선택)</span></label>
          <div style="display: flex; gap: 10px;">
            <input type="email" placeholder="팀원 이메일 주소" value="{{ inviteEmail }}" onChange="{{ onInvite }}" style="flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; font-size: 15px; color: #FFFFFF; font-family: inherit; outline: none; min-width: 0;" style-focus="border-color: #C8FF3D;">
            <button type="button" onClick="{{ invite }}" style="flex-shrink: 0; background: rgba(200,255,61,0.12); color: #C8FF3D; border: 1px solid rgba(200,255,61,0.35); border-radius: 12px; padding: 0 20px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;" style-hover="background: rgba(200,255,61,0.2);">초대</button>
          </div>
          <sc-if value="{{ invited }}" hint-placeholder-val="{{ false }}">
            <div style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 12px; font-weight: 700; color: #C8FF3D; background: rgba(200,255,61,0.09); border-radius: 8px; padding: 5px 10px;">✓ {{ invitedTo }} 초대장을 보냈어요</div>
          </sc-if>
          <div style="font-size: 12px; color: #626C7F;">본인 제외 최대 1명이에요.</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 700; color: #B7BFCC;">아이디어 제목</label>
          <input type="text" required="{{ true }}" placeholder="예: 동네 빵집 오픈런 알리미" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; font-size: 15px; color: #FFFFFF; font-family: inherit; outline: none;" style-focus="border-color: #C8FF3D;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 700; color: #B7BFCC;">한 줄 소개</label>
          <input type="text" required="{{ true }}" placeholder="서비스를 한 문장으로 설명해 주세요" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; font-size: 15px; color: #FFFFFF; font-family: inherit; outline: none;" style-focus="border-color: #C8FF3D;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 700; color: #B7BFCC;">해결하려는 문제</label>
          <textarea required="{{ true }}" rows="4" placeholder="누가, 언제, 어떤 불편을 겪나요? 구체적일수록 좋아요" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; font-size: 15px; line-height: 1.6; color: #FFFFFF; font-family: inherit; outline: none; resize: vertical;" style-focus="border-color: #C8FF3D;"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 13px; font-weight: 700; color: #B7BFCC;">타깃 고객</label>
          <input type="text" required="{{ true }}" placeholder="예: 갓 구운 빵을 사고 싶은 직장인" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; font-size: 15px; color: #FFFFFF; font-family: inherit; outline: none;" style-focus="border-color: #C8FF3D;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 8px; background: rgba(255,255,255,0.02);">
          <sc-for list="{{ consents }}" as="c" hint-placeholder-count="3">
            <div onClick="{{ c.toggle }}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; cursor: pointer;" style-hover="background: rgba(255,255,255,0.03);">
              <span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; background: {{ c.bg }}; color: #0B1220; border: 1px solid {{ c.border }}; transition: all 0.15s ease;">{{ c.mark }}</span>
              <span style="font-size: 14px; font-weight: 600; color: {{ c.color }};">{{ c.label }}</span>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
          <button type="submit" disabled="{{ btnDisabled }}" style="width: 100%; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 800; font-family: inherit; background: {{ btnBg }}; color: {{ btnFg }}; cursor: {{ btnCursor }}; transition: all 0.2s ease;">신청 완료</button>
        </sc-if>
        <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
          <div style="width: 100%; border-radius: 14px; padding: 16px; background: rgba(200,255,61,0.12); border: 1px solid rgba(200,255,61,0.45); display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="22" height="22" viewBox="0 0 20 20"><path d="M4 10.5 L8.5 15 L16 6" fill="none" stroke="#C8FF3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawLine 0.45s ease-out forwards;"></path></svg>
            <span style="font-size: 16px; font-weight: 800; color: #C8FF3D;">신청이 완료됐어요</span>
          </div>
          <div style="text-align: center; margin-top: -8px;"><a href="PROOVIT Dashboard.dc.html" style="font-size: 14px; font-weight: 700;">대시보드로 이동 →</a></div>
        </sc-if>
        <p style="margin: 0; text-align: center; font-size: 13px; color: #626C7F;">신청 즉시 대시보드가 열리고, 첫 미션이 시작돼요.</p>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280}}">
class Component extends DCLogic {
  state = { checks: [false, false, false], inviteEmail: '', invitedTo: '', done: false, now: Date.now() };
  target = new Date('2026-07-27T23:59:59+09:00').getTime();
  componentDidMount() { this._clock = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this._clock); }
  renderVals() {
    const { checks, done } = this.state;
    const pad = (n) => String(n).padStart(2, '0');
    const diff = Math.max(0, this.target - this.state.now);
    const cdDays = Math.floor(diff / 864e5);
    const cdClock = pad(Math.floor(diff / 36e5) % 24) + ':' + pad(Math.floor(diff / 6e4) % 60) + ':' + pad(Math.floor(diff / 1e3) % 60);
    const labels = ['지표의 공개 리더보드 게시 동의', '애널리틱스 원본 제출 동의', '매주 타 팀 서비스 2개 사용·피드백(상호 테스터) 동의'];
    const consents = labels.map((label, i) => ({
      label,
      mark: checks[i] ? '✓' : '',
      bg: checks[i] ? '#C8FF3D' : 'transparent',
      border: checks[i] ? '#C8FF3D' : 'rgba(255,255,255,0.25)',
      color: checks[i] ? '#F4F6FA' : '#8A93A6',
      toggle: () => this.setState(s => { const c = s.checks.slice(); c[i] = !c[i]; return { checks: c }; }),
    }));
    const allChecked = checks.every(Boolean);
    return {
      cdDays, cdClock, consents, done, notDone: !done,
      btnDisabled: !allChecked,
      btnBg: allChecked ? '#C8FF3D' : 'rgba(255,255,255,0.06)',
      btnFg: allChecked ? '#0B1220' : '#626C7F',
      btnCursor: allChecked ? 'pointer' : 'not-allowed',
      inviteEmail: this.state.inviteEmail,
      invited: !!this.state.invitedTo,
      invitedTo: this.state.invitedTo,
      onInvite: (e) => this.setState({ inviteEmail: e.target.value }),
      invite: () => { if (this.state.inviteEmail.trim()) this.setState({ invitedTo: this.state.inviteEmail.trim(), inviteEmail: '' }); },
      submit: (e) => { e.preventDefault(); if (allChecked) this.setState({ done: true }); },
    };
  }
}
</script>
</body>
</html>
